{% load custom_tags %}
<div class="{{ date_wrapper_class }} blog-date-shell blog-date-style-{{ blog_preferences.active_design_customization.post_date_style|default:'classic_vertical' }} blog-date-effect-{{ blog_preferences.active_design_customization.post_date_effect|default:'solid' }}" data-post-primary-date data-date-style="{{ blog_preferences.active_design_customization.post_date_style|default:'classic_vertical' }}" data-date-effect="{{ blog_preferences.active_design_customization.post_date_effect|default:'solid' }}">
    <div class="blog-date-main">
        <div class="blog-date-day-wrap">
            <div class="blog-date-day">{{ post.publication_datetime|date:"d" }}</div>
        </div>
        <div class="blog-date-text">
            <div class="blog-date-month">{{ post.publication_datetime|month_hr|upper }}</div>
            <div class="blog-date-year">{{ post.publication_datetime|date:"Y" }}</div>
        </div>
    </div>
    <div class="blog-date-inline">
        <span class="blog-date-inline-day">{{ post.publication_datetime|date:"d" }}</span>
        <span class="blog-date-inline-sep">/</span>
        <span class="blog-date-inline-month">{{ post.publication_datetime|month_hr|upper }}</span>
        <span class="blog-date-inline-sep">/</span>
        <span class="blog-date-inline-year">{{ post.publication_datetime|date:"Y" }}</span>
    </div>
</div>
