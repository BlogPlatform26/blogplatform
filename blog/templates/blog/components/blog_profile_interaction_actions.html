{% if request.user.is_authenticated and request.user != blog %}
    <div class="{{ profile_actions_class }}">
        {% if not is_restricted %}
            <form method="post" action="{% url 'follow_toggle' blog.username %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn {% if is_following %}btn-outline-primary{% else %}btn-primary{% endif %} btn-sm{% if profile_follow_button_extra_class %} {{ profile_follow_button_extra_class }}{% endif %}">
                    {% if is_following %}Pratiš{% else %}Prati{% endif %}
                </button>
            </form>
        {% endif %}

        <div class="dropdown {{ profile_dropdown_class }}">
            <a class="{{ profile_dropdown_toggle_class }}"
               href="#"
               role="button"
               data-bs-toggle="dropdown"
               aria-expanded="false"
               title="Više opcija">
                <i class="bi bi-three-dots {{ profile_icon_size_class }}"></i>
            </a>

            <ul class="dropdown-menu dropdown-menu-end {{ profile_dropdown_menu_class }}">
                {% if is_following %}
                    <li>
                        <form method="post" action="{% url 'unfollow_user' blog.username %}" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item">Prestani pratiti</button>
                        </form>
                    </li>
                {% else %}
                    <li>
                        <form method="post" action="{% url 'follow_toggle' blog.username %}" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item" {% if is_restricted %}disabled{% endif %}>Prati korisnika</button>
                        </form>
                    </li>
                {% endif %}

                <li>
                    <form method="post" action="{% url 'restrict_user' blog.username %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item">Ograniči korisnika</button>
                    </form>
                </li>

                <li><hr class="dropdown-divider"></li>

                <li>
                    <form method="post" action="{% url 'block_user' blog.username %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger">Blokiraj korisnika</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
{% endif %}
