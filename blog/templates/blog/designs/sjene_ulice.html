{% extends "blog/layouts/blog_design_base.html" %}
{% load static %}

{% block content %}
    {% include "blog/components/blog_design_styles.html" %}
    <style>
body {
    background: #161210;
    color: #ece1d7;
    min-height: 100vh;
    position: relative;
    --analytics-stat-card-bg: rgba(21, 17, 15, 0.32);
    --analytics-stat-card-border: rgba(201, 155, 111, 0.10);
    --analytics-stat-card-color: #ece1d7;
    --analytics-stat-value-color: #f8efe8;
    --analytics-stat-label-color: rgba(236, 225, 215, 0.68);
    --analytics-stat-card-shadow: none;
    --analytics-page-row-bg: rgba(21, 17, 15, 0.28);
    --analytics-page-row-border: rgba(201, 155, 111, 0.10);
    --analytics-page-row-color: #ece1d7;
    --analytics-map-card-bg: rgba(21, 17, 15, 0.28);
    --analytics-map-card-border: rgba(201, 155, 111, 0.10);
    --analytics-map-card-shadow: none;
}

body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: clamp(520px, 68vw, 980px);
    pointer-events: none;
    z-index: 0;
    background-image:
        linear-gradient(
            to bottom,
            rgba(9, 7, 7, 0.00) 0%,
            rgba(11, 9, 9, 0.04) 28%,
            rgba(15, 12, 11, 0.18) 46%,
            rgba(18, 14, 13, 0.44) 60%,
            rgba(22, 18, 16, 0.72) 74%,
            rgba(22, 18, 16, 0.90) 86%,
            rgba(22, 18, 16, 0.98) 94%,
            #161210 100%
        ),
        url('{% static "blog/images/design-backgrounds/sjene_ulice.png" %}');
    background-repeat: no-repeat, no-repeat;
    background-position: center top, center top;
    background-size: 100% 100%, 100% auto;
}

nav.navbar,
nav.navbar .dropdown-menu {
    z-index: 4000 !important;
}

.container-fluid.mt-3,
footer {
    position: relative;
    z-index: 2;
}

.container-fluid.mt-3 {
    margin-top: 0 !important;
    padding-top: 0 !important;
}

.blog-header-wrap,
.blog-main-layout-row {
    position: relative;
    z-index: 2;
    max-width: min(1460px, calc(100vw - 44px));
    margin-left: auto;
    margin-right: auto;
}

.blog-header-wrap > .row,
.blog-main-layout-row,
.blog-banner-strip > .row {
    --bs-gutter-x: 22px;
}

.blog-header-main {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    padding-top: 20px;
}

.blog-header-main,
.blog-header-main .blog-user-dropdown-toggle,
.blog-header-main .small,
.blog-header-main span,
.blog-header-main strong {
    color: #f0e6de !important;
    text-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
}

.blog-page-title,
.blog-page-title a {
    color: var(--blog-title-color, #fff5ed) !important;
    text-decoration: none;
    text-shadow: 0 10px 26px rgba(0, 0, 0, 0.50);
}

.page-top-align {
    margin-top: 248px;
}

.blog-post-entry,
.calendar-box,
.archive-box,
.sidebar-box,
.live-analytics-widget,
.comment-body {
    background: rgba(19, 16, 14, 0.34) !important;
    border: 1px solid rgba(201, 155, 111, 0.10) !important;
    border-radius: 18px;
    box-shadow: none !important;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

.blog-post-entry {
    padding: 22px 24px;
}

.blog-post-entry + .blog-post-entry {
    margin-top: 22px;
}

.calendar-box,
.archive-box,
.sidebar-box,
.live-analytics-widget {
    width: 100%;
    max-width: 260px;
}

.calendar-box {
    padding: 16px;
    margin-left: auto;
}

.archive-box,
.sidebar-box,
.live-analytics-widget {
    padding: 0;
}

.sidebar-box {
    margin-top: 20px;
}

.sidebar-left-align {
    margin-left: auto;
    margin-right: 0;
}

.sidebar-right-align {
    margin-right: auto;
    margin-left: 0;
}

.archive-title,
.sidebar-box-title {
    padding: 14px 16px 12px;
    margin: 0;
    background: transparent !important;
    border-bottom: 1px solid rgba(201, 155, 111, 0.08);
}

.archive-title::after,
.sidebar-box-title::after,
.calendar-title::after,
.blog-post-entry hr::after {
    content: none !important;
    display: none !important;
}

.archive-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 16px 16px;
}

.archive-link {
    color: rgba(240, 230, 221, 0.80);
    text-decoration: none;
    font-size: 13px;
    line-height: 1.3;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid rgba(201, 155, 111, 0.06);
    background: rgba(255, 255, 255, 0.02);
}

.archive-link:hover {
    color: #fff6ee;
    border-color: rgba(201, 155, 111, 0.18);
}

.archive-empty,
.sidebar-box-content,
.calendar-title,
.calendar-weekdays,
.post-meta,
.comment-time,
.small,
.text-muted {
    color: rgba(236, 225, 215, 0.68) !important;
}

.calendar-title,
.archive-title,
.sidebar-box-title,
.blog-box-title {
    color: var(--box-title-color, #d5b08a) !important;
}

.blog-post-entry h4,
.blog-post-title,
.blog-post-entry h4 a {
    color: var(--post-title-color, #fff3ea) !important;
}

.comment-author a,
.sidebar-box-content a,
a {
    color: #d8b084;
}

a:hover {
    color: #f2d1ad;
}

.btn-outline-light {
    border-color: rgba(216, 176, 132, 0.30) !important;
    color: #f2d1ad !important;
}

.btn-outline-light:hover {
    background: rgba(216, 176, 132, 0.10) !important;
    color: #fff5ec !important;
}

.post-meta-category,
.home-post-meta-category {
    color: rgba(242, 209, 173, 0.80) !important;
}

.post-meta-tag,
.home-post-meta-tag {
    color: rgba(236, 225, 215, 0.68) !important;
}

.blog-post-entry hr {
    border: 0;
    border-top: 1px solid rgba(201, 155, 111, 0.10);
    margin: 28px 0 0;
    opacity: 1;
}

.blog-date-day {
    background: none !important;
    -webkit-text-fill-color: #d5b08a !important;
    color: #d5b08a !important;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
}

.blog-date-month {
    background: none !important;
    -webkit-text-fill-color: rgba(240, 230, 221, 0.78) !important;
    color: rgba(240, 230, 221, 0.78) !important;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.blog-date-year {
    color: rgba(240, 230, 221, 0.54) !important;
    font-size: 11px;
}

.calendar-grid {
    gap: 7px;
}

/* Phase 93b: restore a seven-day calendar without squeezing the tablet sidebar. */
.calendar-weekdays,
.calendar-grid {
    display: grid !important;
    grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
    text-align: center;
}

.calendar-day {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    text-decoration: none;
    border-radius: 8px;
    background: rgba(46, 37, 31, 0.48) !important;
    color: rgba(248, 240, 234, 0.82) !important;
    border: 1px solid rgba(201, 155, 111, 0.07) !important;
    box-shadow: none !important;
}

.calendar-day:hover {
    color: #fff6ef !important;
    border-color: rgba(201, 155, 111, 0.16) !important;
    background: rgba(56, 45, 38, 0.54) !important;
}

.calendar-day-has-post {
    border-color: rgba(201, 155, 111, 0.16) !important;
    background: rgba(56, 45, 38, 0.56) !important;
}

.calendar-day-today {
    background: rgba(125, 85, 52, 0.78) !important;
    color: #fff5eb !important;
    border-color: rgba(242, 209, 173, 0.24) !important;
    font-weight: 700;
}

.comment-body {
    padding: 10px 44px 10px 12px;
}

textarea.form-control,
input.form-control,
select.form-select {
    background: rgba(33, 27, 24, 0.66) !important;
    color: #f4e8de !important;
    border-color: rgba(201, 155, 111, 0.14) !important;
}

textarea.form-control::placeholder,
input.form-control::placeholder {
    color: rgba(244, 232, 222, 0.56) !important;
}

@media (max-width: 991px) {
    body::before {
        height: min(76vw, 470px);
        background-size: 100% 100%, 100% auto;
    }

    .blog-header-wrap,
    .blog-main-layout-row {
        max-width: calc(100vw - 24px);
    }

    .page-top-align {
        margin-top: 214px;
    }
}

@media (max-width: 767.98px) {
    .calendar-weekdays,
    .calendar-grid {
        gap: 2px;
    }

    .calendar-grid a[class*="calendar-day"] {
        min-width: 0 !important;
        width: 100%;
        min-height: 44px !important;
    }
}

@media (min-width: 768px) and (max-width: 991.98px) {
    html body .blog-main-layout-row > .blog-main-left-column,
    html body .blog-main-layout-row > .blog-main-content-column,
    html body .blog-main-layout-row > .blog-main-right-column {
        flex: 0 0 100%;
        width: 100%;
        max-width: 100%;
    }

    html body .calendar-box {
        min-width: 0;
        width: min(100%, 376px) !important;
        max-width: 376px !important;
        padding: 12px;
        margin-inline: auto !important;
    }

    html body .calendar-title--nav {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        gap: 2px;
        align-items: center;
    }

    html body .calendar-title--nav > span {
        min-width: 0;
        overflow-wrap: anywhere;
    }

    html body .calendar-weekdays,
    html body .calendar-grid {
        gap: 2px;
    }

    html body .calendar-grid a[class*="calendar-day"] {
        min-width: 44px !important;
        min-height: 44px !important;
        width: 100%;
        justify-self: stretch !important;
    }
}

/* Phase 93c: keep small actions and comments readable over either photo crop. */
html body .post-actions form > button.btn.btn-link {
    color: #f5d4ac !important;
    background: #241813 !important;
    border-radius: 6px;
}

html body [id^="comments-"] > .small.text-muted {
    display: inline-block;
    max-width: 100%;
    color: #f5d4ac !important;
    background: #241813 !important;
    border-radius: 6px;
    padding: 6px 8px;
}

html body [id^="comments-"] .comment-item.bp-modern-comment-item .comment-body.bp-modern-comment-body {
    background: #241813 !important;
}

html body .calendar-title--nav a.calendar-month-nav-link {
    color: #f5d4ac !important;
    background: #241813 !important;
}

/* Phase 93d: anchor foreground content independently of the city photo crop. */
html body .blog-header-main .blog-page-title,
html body .blog-header-main .blog-page-subtitle {
    width: fit-content;
    max-width: 100%;
    padding: 6px 10px;
    border-radius: 12px;
    background: #241813 !important;
}

html body .blog-header-main .blog-page-subtitle {
    opacity: 1;
    color: #f5d4ac !important;
}

/* Phase 93e: keep an unbroken blog name inside the protected title surface. */
html body .blog-header-main .blog-page-title {
    box-sizing: border-box;
    min-width: 0;
    overflow-wrap: anywhere;
}

html body .blog-header-main .blog-page-title a {
    white-space: normal;
    overflow-wrap: anywhere;
}

/* Phase 93f: let the post and comment use the available narrow viewport. */
@media (max-width: 575.98px) {
    html body .blog-main-content-column .blog-posts-shell {
        width: 100%;
        max-width: 100%;
        padding-inline: 0;
    }

    html body .blog-post-entry {
        padding: 16px;
    }

    html body .blog-post-entry > .d-flex:first-child {
        flex-direction: column;
        align-items: stretch !important;
        gap: 8px !important;
    }

    html body .blog-post-entry .blog-post-title {
        font-size: min(var(--post-title-size), clamp(1.5rem, 7vw, 2rem)) !important;
        line-height: 1.2;
        overflow-wrap: anywhere;
    }

    html body .blog-post-entry .blog-date-shell {
        min-width: 0;
        width: 100%;
        margin-left: 0 !important;
        text-align: left !important;
    }

    html body .blog-post-entry [id^="comments-"] h6 {
        font-size: min(var(--post-title-size), 1.5rem) !important;
        line-height: 1.2;
        overflow-wrap: anywhere;
    }

    html body .blog-post-entry .comment-item.bp-modern-comment-item {
        flex-direction: column;
        align-items: stretch;
    }

    html body .blog-post-entry .comment-body.bp-modern-comment-body {
        width: 100%;
    }
}

html body .blog-post-entry,
html body .calendar-box,
html body .archive-box,
html body .sidebar-box,
html body .live-analytics-widget {
    background: #241813 !important;
}

html body .blog-profile-panel {
    padding: 14px;
    border-radius: 18px;
    background: #241813 !important;
}

html body .blog-post-entry .blog-date-shell.blog-date-effect-gradient .blog-date-year {
    color: #e4d3c3 !important;
    -webkit-text-fill-color: #e4d3c3 !important;
    opacity: 1;
}

/* BLOGPLATFORM_SJENE_ULICE_COMMENT_TEXT_WHITE_START */
.comment-body .comment-text,
.comment-body .comment-text *,
.comment-body .bp-comment-text,
.comment-body .bp-comment-text *,
.comment-body .bp-comment-word {
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
}

.comment-body .bp-mention-link,
.comment-body .bp-mention-link * {
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
    text-decoration: underline !important;
}

.comment-body .comment-time {
    color: rgba(255, 255, 255, 0.75) !important;
    -webkit-text-fill-color: rgba(255, 255, 255, 0.75) !important;
}
/* BLOGPLATFORM_SJENE_ULICE_COMMENT_TEXT_WHITE_END */
</style>
    {% include "blog/components/blog_posts.html" %}
{% endblock %}
